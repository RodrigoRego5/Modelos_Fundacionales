name: ajuste_acotado
datasets: [configs/framingham.yaml]
models: [lightgbm]
split_seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 100, 111]
train_sizes: [0.3]
sampling_seed: 123
model_seed: 42
model_params:
  lightgbm: {n_estimators: 400, learning_rate: 0.05, n_jobs: 4}
variants:
  - name: referencia
    optimization: null
  - name: ajustado
    # Se aplica después del ajuste de hiperparámetros, solo con train.
    # null (o eliminar el bloque) conserva el umbral original del modelo.
    threshold_optimization:
      scoring: f1
      cv_folds: 3
      random_state: 789
      # Para maximizar recall: scoring: recall y min_precision: 0.30.
    optimization:
      n_iter: 4
      cv_folds: 3
      random_state: 456
      scoring: f1
      param_distributions:
        lightgbm:
            num_leaves: [3, 5, 7, 11, 15]
            max_depth: [2, 3, 4, 5]
            min_child_samples: [80, 100, 120, 150, 180]
            learning_rate: [0.02, 0.03, 0.04, 0.05, 0.07]
            n_estimators: [100, 200, 300, 400, 600]
            scale_pos_weight: [3, 4, 5, 6, 7.5, 9, 11]
            reg_lambda: [1, 5, 10, 15, 20]
            reg_alpha: [0, 0.1, 0.5, 1, 2]
            colsample_bytree: [0.7, 0.85, 1.0]
tracking:
  experiment_name: practica_05_ajuste

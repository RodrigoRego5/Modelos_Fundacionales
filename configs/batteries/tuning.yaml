name: ajuste_acotado
datasets: [configs/framingham.yaml]
models: [tabpfn]
split_seeds: [10,20,30]
train_sizes: [1.0]
sampling_seed: 123
model_seed: 42

model_params:
  tabpfn:
    n_estimators: 4
    softmax_temperature: 0.9
    balance_probabilities: false
    average_before_softmax: false

variants:
  - name: referencia
    optimization: null
    threshold_optimization: null

  - name: solo_umbral
    optimization: null
    threshold_optimization:
      scoring: f1
      cv_folds: 5
      random_state: 789

tracking:
  experiment_name: practica_05_ajuste

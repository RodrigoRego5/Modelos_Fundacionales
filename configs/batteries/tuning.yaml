name: ajuste_acotado
datasets: [configs/framingham.yaml]
models: [lightgbm, tabpfn]
split_seeds: [11, 22, 33]
train_sizes: [0.3]
sampling_seed: 123
model_seed: 42
model_params:
  lightgbm: {n_estimators: 400, learning_rate: 0.05, n_jobs: 4}
  tabpfn: {n_estimators: 4}
variants:
  - name: referencia
    optimization: null
  - name: ajustado
    optimization:
      n_iter: 4
      cv_folds: 3
      random_state: 456
      scoring: average_precision
      param_distributions:
        lightgbm:
          num_leaves: [15, 31]
          min_child_samples: [10, 30]
        tabpfn:
          n_estimators: [2, 4, 8, 16]
tracking:
  experiment_name: practica_05_ajuste

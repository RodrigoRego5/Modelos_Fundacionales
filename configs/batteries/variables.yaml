name: tipos_variables
datasets: [configs/framingham.yaml]
models: [lightgbm, tabpfn]
split_seeds: [11, 22, 33]
train_sizes: [1.0]
sampling_seed: 123
model_seed: 42
model_params:
  lightgbm: {n_estimators: 400, learning_rate: 0.05, n_jobs: 4}
  tabpfn: {n_estimators: 4}
variants:
  - name: todas
    features: {mode: all}
  - name: numericas
    features: {mode: numeric}
  - name: categoricas
    features: {mode: categorical}
tracking:
  experiment_name: practica_04_variables

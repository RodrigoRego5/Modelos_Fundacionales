name: preprocesamiento
datasets: [configs/framingham.yaml]
models: [lightgbm, tabpfn]
split_seeds: [11, 22, 33, 44, 55]
train_sizes: [1.0]
sampling_seed: 123
model_seed: 42
model_params:
  lightgbm: {n_estimators: 400, learning_rate: 0.05, scale_pos_weight: 85 / 15, n_jobs: 4}
  tabpfn: {n_estimators: 8, balance_probabilities}
variants:
  - name: minimo
    preprocessing: {numerical_missing: median, categorical_encoding: ordinal}
  - name: one_hot
    preprocessing: {numerical_missing: median, categorical_encoding: one_hot}
  - name: media
    preprocessing: {numerical_missing: mean, categorical_encoding: ordinal}
tracking:
  experiment_name: practica_03_preprocesamiento

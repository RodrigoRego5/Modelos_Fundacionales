name: lightgbm_comparacion_ajustes
datasets: [configs/framingham.yaml]
models: [lightgbm]
split_seeds: [15, 22, 36, 45, 67]
train_sizes: [1.0]
sampling_seed: 123
model_seed: 42

# Referencia comun; la busqueda modifica solo los parametros de su espacio.
model_params:
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    n_jobs: 4
    verbosity: -1

variants:
  - name: referencia
    optimization: null
    threshold_optimization: null

  - name: solo_umbral
    optimization: null
    threshold_optimization: &ajuste_umbral
      scoring: f1
      cv_folds: 3
      random_state: 789

  - name: solo_hiperparametros
    threshold_optimization: null
    optimization: &ajuste_hiperparametros
      n_iter: 12
      cv_folds: 3
      random_state: 456
      scoring: f1
      param_distributions:
        lightgbm:
          num_leaves: [3, 5, 7, 11, 15]
          max_depth: [2, 3, 4, 5]
          min_child_samples: [80, 100, 120, 150, 180]
          learning_rate: [0.02, 0.03, 0.04, 0.05, 0.07]
          n_estimators: [100, 200, 300, 400, 600]
          scale_pos_weight: [3, 4, 5, 6, 7.5, 9, 11]
          reg_lambda: [1, 5, 10, 15, 20]
          reg_alpha: [0, 0.1, 0.5, 1, 2]
          colsample_bytree: [0.7, 0.85, 1.0]

  - name: hiperparametros_y_umbral
    optimization: *ajuste_hiperparametros
    threshold_optimization: *ajuste_umbral

tracking:
  experiment_name: practica_05_lightgbm_comparacion

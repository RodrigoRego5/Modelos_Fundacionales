name: credit
dataset:
  path: data/default of credit card clients.xls
  target: default payment next month
  drop_columns: [ID]
preprocessing:
  numerical_missing: median
  categorical_encoding: one_hot
split: {test_size: 0.2, random_state: 42}
evaluation:
  metrics: [roc_auc, f1, accuracy, recall, pr_auc, balanced_accuracy, precision, average_precision]
models:
  lightgbm: {n_estimators: 200, learning_rate: 0.05, verbosity: -1}
  tabpfn: {}
tracking:
  experiment_name: comparacion_modelos
  run_name: credit_baseline
